[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sme"
version = "1.2.0"
description = "Spatial Memory Engine - a next-generation AI long-term memory system"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "httpx>=0.24",
    "fastapi>=0.100",
    "uvicorn>=0.23",
    "matplotlib>=3.7",
    "networkx>=3.0",
]

[project.optional-dependencies]
ann = ["hnswlib>=0.8"]
local-embeddings = ["sentence-transformers>=2.2", "torch>=2.0"]
multipart = ["python-multipart>=0.0.9"]

[tool.setuptools.packages.find]
include = ["sme*"]

[tool.setuptools.package-data]
sme = ["config.json"]
