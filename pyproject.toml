[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sme"
version = "1.3.0"
description = "Spatial Memory Engine - a next-generation AI long-term memory system"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "httpx>=0.24",
    "fastapi>=0.100",
    "uvicorn>=0.23",
    "networkx>=3.0",
]

[project.optional-dependencies]
ann = ["hnswlib>=0.8"]
local-embeddings = ["sentence-transformers>=2.2", "torch>=2.0"]
# int8 ONNX embeddings (fastembed 0.8+ bundles onnxruntime>=1.23, required by
# the quantized Qwen3 export; the legacy "fastembed-onnx" package no longer
# exists on PyPI)
onnx = ["fastembed>=0.8"]
multipart = ["python-multipart>=0.0.9"]
viz = ["matplotlib>=3.7"]
mcp = ["mcp>=2.0"]

[tool.setuptools.packages.find]
include = ["sme*"]

[tool.setuptools.package-data]
sme = ["api/static/*"]
